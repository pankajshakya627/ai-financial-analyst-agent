version: "3.9"

services:
  financial-analyst:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Named volume: Docker initializes it with the image's /app/data ownership
      # (UID 1000), unlike a host bind-mount which can be root-owned
      - app_data:/app/data
    restart: unless-stopped

  # Optional local LLM: docker compose --profile ollama up
  # (set OLLAMA_BASE_URL=http://ollama:11434 in .env). Works on CPU; for NVIDIA GPUs
  # add a `deploy.resources.reservations.devices` entry with driver: nvidia.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  app_data:
  ollama_data:
